# Despliegue en Render (Blueprint): base de datos PostgreSQL, API Django y frontend estático.
# En Render: New > Blueprint > seleccionar este repositorio.
databases:
  - name: papel-y-luna-db
    plan: free
    databaseName: papelyluna
    user: papelyluna

services:
  - type: web
    name: papel-y-luna-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py migrate && python manage.py seed_pos && gunicorn pos.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /api/auth/me/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        fromDatabase:
          name: papel-y-luna-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://papel-y-luna-web.onrender.com
      - key: ADMIN_PASSWORD
        value: Admin123!
      - key: CASHIER_PASSWORD
        value: Cajero123!

  - type: web
    name: papel-y-luna-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      # El frontend llama a /api en su mismo dominio y Render lo reenvía al backend.
      # Así la cookie de sesión es del mismo sitio y el login funciona en todos los navegadores.
      - key: VITE_API_URL
        value: /api
      - key: NODE_VERSION
        value: 22.12.0
    routes:
      - type: rewrite
        source: /api/*
        destination: https://papel-y-luna-api.onrender.com/api/*
